# fly.toml app configuration file generated for pajrate-bot on 2026-07-30T10:52:50Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pajrate-bot'
primary_region = 'ams'

[build]

[env]
  PORT = '8080'
  DATA_DIR = '/data'

[[mounts]]
  source      = 'pajrate_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
