# fly.toml app configuration file generated for pajrate-bot on 2026-07-27T23:49:47Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pajrate-bot'
primary_region = 'ams'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'

# Price alerts are stored in a local JSON file (./data/alerts.json) which
# lives on the machine's local disk and is wiped on redeploy. To keep
# alerts across deploys, create a volume and mount it:
#   fly volumes create pajrate_data --size 1 --region ams
# [[mounts]]
#   source = "pajrate_data"
#   destination = "/app/data"
